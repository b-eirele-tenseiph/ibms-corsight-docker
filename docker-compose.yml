name: ibms
x-vite-args: &vite-args
  VITE_APP_NAME: ${APP_NAME:-Laravel}
  VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
  VITE_REVERB_HOST: ${VITE_REVERB_HOST}
  VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
  VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
    args: *vite-args
  image: ibms-app:latest
  restart: unless-stopped
  cpu_shares: 256
  volumes:
    - ./.env:/var/www/html/.env:ro
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  app:
    <<: *app
    deploy: { resources: { limits: { cpus: "2.0", memory: 2G } } }

  queue:
    <<: *app
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }

  scheduler:
    <<: *app
    command: php artisan schedule:work
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ["127.0.0.1:18081:8080"]
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
      args: *vite-args
    image: ibms-web:latest
    restart: unless-stopped
    cpu_shares: 256
    ports: ["18080:80"]
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on: [app]
    deploy: { resources: { limits: { memory: 128M } } }

  db:
    image: mysql:8.0
    restart: unless-stopped
    cpu_shares: 256
    command: --innodb-buffer-pool-size=256M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [dbdata:/var/lib/mysql]
    ports: ["127.0.0.1:13306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy: { resources: { limits: { cpus: "1.0", memory: 1G } } }

networks:
  default:
    ipam:
      config:
        - subnet: 10.77.0.0/24

volumes:
  dbdata:
  storage:
